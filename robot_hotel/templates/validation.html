<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de Réservation | Hôtel Robot</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #64748b;
            --success: #10b981;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--surface);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
        }

        /* En-tête avec motif */
        .header {
            background: var(--primary);
            padding: 40px 30px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.2), transparent 70%);
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
            animation: bounce 2s infinite;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            position: relative;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
        }

        /* Contenu */
        .content {
            padding: 30px;
        }

        /* Carte récapitulative */
        .summary-box {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-row:last-child { margin-bottom: 0; }

        .label { color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .value { font-weight: 600; color: var(--text-main); text-align: right; }

        /* Actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        /* Messages d'état */
        .status {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .status.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* Loader */
        .loader {
            width: 20px; height: 20px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
            display: none;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }

        /* Footer */
        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span class="header-icon">🏨</span>
            <h1>Récapitulatif</h1>
            <p>Vérifiez les détails avant de confirmer</p>
        </div>

        <div class="content">
            <div id="statusMessage" class="status"></div>

            <div id="loadingState" style="text-align: center; padding: 20px; display: none;">
                <p style="color: var(--text-muted);">Chargement des données...</p>
            </div>

            <div id="mainContent">
                <div class="summary-box">
                    <div class="summary-row">
                        <span class="label">👤 Nom complet</span>
                        <span class="value" id="userName">--</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">📧 Email</span>
                        <span class="value" id="userEmail">--</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">📅 Dates</span>
                        <span class="value" id="userDates">--</span>
                    </div>
                    <div class="summary-row">
                        <span class="label">🛏️ Chambre</span>
                        <span class="value" id="userRoom">--</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" onclick="confirmBooking()" id="confirmBtn">
                        <span class="loader" id="btnLoader"></span>
                        <span id="btnText">Confirmer la réservation</span>
                    </button>
                    
                    <button class="btn btn-outline" onclick="showEditForm()">
                        ✏️ Modifier les informations
                    </button>
                </div>
                
                <!-- Formulaire de modification (caché par défaut) -->
                <div id="editForm" style="display: none; margin-top: 20px;">
                    <div class="summary-box">
                        <h3 style="margin-bottom: 15px; color: var(--primary);">Modifier les informations</h3>
                        
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Nom</label>
                            <input type="text" id="editNom" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
                        </div>
                        
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Prénom</label>
                            <input type="text" id="editPrenom" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
                        </div>
                        
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Email</label>
                            <input type="email" id="editEmail" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
                        </div>
                        
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Type de chambre</label>
                            <select id="editChambre" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
                                <option value="simple">Simple</option>
                                <option value="double">Double</option>
                                <option value="suite">Suite</option>
                            </select>
                        </div>
                        
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Date d'arrivée</label>
                            <input type="date" id="editArrivee" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
                        </div>
                        
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Date de départ</label>
                            <input type="date" id="editDepart" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-primary" onclick="saveChanges()" style="flex: 1;">
                            💾 Enregistrer
                        </button>
                        <button class="btn btn-outline" onclick="hideEditForm()" style="flex: 1;">
                            Annuler
                        </button>
                    </div>
                </div>
            </div>

            <div class="footer">
                🔒 Paiement sécurisé SSL 256-bit
            </div>
        </div>
    </div>

    <script>
        // Récupération de l'ID de session depuis l'URL
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');

        // Stocker les données pour modification
        let reservationData = {};

        // Charger les données au démarrage
        document.addEventListener('DOMContentLoaded', async () => {
            if (!sessionId) {
                showStatus('Lien invalide ou expiré.', 'error');
                document.getElementById('mainContent').style.display = 'none';
                return;
            }

            // Appel API pour récupérer les infos de la session
            try {
                const res = await fetch(`/get_reservation_session?session_id=${sessionId}`);
                const data = await res.json();

                if (data.error || !data.user_data) {
                    throw new Error(data.error || 'Session non trouvée');
                }
                
                const userData = data.user_data;
                reservationData = userData;

                // Remplissage du tableau
                document.getElementById('userName').textContent = `${userData.prenom || ''} ${userData.nom || ''}`;
                document.getElementById('userEmail').textContent = userData.email || 'Non renseigné';
                
                // Format dates
                const arrival = userData.date_arrivee || '--';
                const departure = userData.date_depart || '--';
                document.getElementById('userDates').textContent = `${arrival} au ${departure}`;
                
                // Format room type
                const roomTypes = { 'simple': 'Simple', 'double': 'Double', 'suite': 'Suite' };
                document.getElementById('userRoom').textContent = roomTypes[userData.type_chambre] || 'Standard';

                // Remplir le formulaire de modification
                document.getElementById('editNom').value = userData.nom || '';
                document.getElementById('editPrenom').value = userData.prenom || '';
                document.getElementById('editEmail').value = userData.email || '';
                document.getElementById('editChambre').value = userData.type_chambre || 'simple';
                document.getElementById('editArrivee').value = userData.date_arrivee || '';
                document.getElementById('editDepart').value = userData.date_depart || '';

            } catch (err) {
                console.error(err);
                showStatus('Impossible de récupérer votre réservation: ' + err.message, 'error');
            }
        });

        // Afficher le formulaire de modification
        function showEditForm() {
            document.querySelector('.actions').style.display = 'none';
            document.getElementById('editForm').style.display = 'block';
        }

        // Masquer le formulaire de modification
        function hideEditForm() {
            document.getElementById('editForm').style.display = 'none';
            document.querySelector('.actions').style.display = 'flex';
        }

        // Enregistrer les modifications
        async function saveChanges() {
            const corrections = {
                nom: document.getElementById('editNom').value,
                prenom: document.getElementById('editPrenom').value,
                email: document.getElementById('editEmail').value,
                type_chambre: document.getElementById('editChambre').value,
                date_arrivee: document.getElementById('editArrivee').value,
                date_depart: document.getElementById('editDepart').value
            };

            try {
                // Sauvegarder directement dans la session
                const res = await fetch('/update_reservation_session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        session_id: sessionId, 
                        data: corrections
                    })
                });
                
                const result = await res.json();

                if (result.success) {
                    showStatus('✅ Modifications enregistrées !', 'success');
                    
                    // Mettre à jour l'affichage
                    reservationData = { ...reservationData, ...corrections };
                    document.getElementById('userName').textContent = `${corrections.prenom || ''} ${corrections.nom || ''}`;
                    document.getElementById('userEmail').textContent = corrections.email || 'Non renseigné';
                    document.getElementById('userDates').textContent = `${corrections.date_arrivee || '--'} au ${corrections.date_depart || '--'}`;
                    
                    const roomTypes = { 'simple': 'Simple', 'double': 'Double', 'suite': 'Suite' };
                    document.getElementById('userRoom').textContent = roomTypes[corrections.type_chambre] || 'Standard';
                    
                    // Retourner à la vue normale
                    hideEditForm();
                } else {
                    throw new Error(result.error || 'Erreur lors de l\'enregistrement');
                }

            } catch (err) {
                showStatus('Erreur: ' + err.message, 'error');
            }
        }

        async function confirmBooking() {
            const btn = document.getElementById('confirmBtn');
            const loader = document.getElementById('btnLoader');
            const btnText = document.getElementById('btnText');

            // UI Loading
            btn.disabled = true;
            loader.style.display = 'inline-block';
            btnText.textContent = 'Validation en cours...';

            try {
                // Envoyer les donnees actuelles du formulaire (au cas ou l'utilisateur n'a pas clique Enregistrer)
                const formData = {
                    nom: document.getElementById('editNom').value,
                    prenom: document.getElementById('editPrenom').value,
                    email: document.getElementById('editEmail').value,
                    type_chambre: document.getElementById('editChambre').value,
                    date_arrivee: document.getElementById('editArrivee').value,
                    date_depart: document.getElementById('editDepart').value
                };
                const res = await fetch('/confirm_reservation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, send_email: true, user_data: formData })
                });
                
                // Check if response is OK
                if (!res.ok) {
                    throw new Error('Erreur serveur: ' + res.status);
                }
                
                // Get text first to check if it's valid JSON
                const text = await res.text();
                if (!text || text.trim() === '') {
                    throw new Error('Réponse vide du serveur');
                }
                
                let result;
                try {
                    result = JSON.parse(text);
                } catch (parseErr) {
                    console.error('JSON parse error:', parseErr, 'Response:', text);
                    throw new Error('Réponse invalide du serveur');
                }

                if (result.success) {
                    showStatus('✅ Réservation confirmée ! Un email vous a été envoyé.', 'success');
                    document.querySelector('.actions').style.display = 'none';
                    
                    // Redirection vers succès après 2 secondes
                    setTimeout(() => {
                        window.location.href = '/reservation_success?reservation_id=' + (result.reservation_id || '');
                    }, 2000);
                } else {
                    throw new Error(result.error || 'Erreur serveur');
                }

            } catch (err) {
                console.error('Confirm booking error:', err);
                showStatus('Erreur lors de la confirmation: ' + err.message, 'error');
                btn.disabled = false;
                loader.style.display = 'none';
                btnText.textContent = 'Confirmer & Payer';
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = `status ${type}`;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
