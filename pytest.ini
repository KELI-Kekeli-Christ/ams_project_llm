[pytest]
# Configuration pytest pour Robot Hotel

# Répertoires de recherche
testpaths = tests

# Patterns de noms de fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marqueurs personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    security: Tests de sécurité
    slow: Tests lents (peuvent être exclus avec -m "not slow")
    requires_api: Tests nécessitant les APIs actives
    requires_db: Tests nécessitant la base de données

# Options par défaut
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Ignorer certains répertoires
norecursedirs = 
    .git
    .venv
    venv
    env
    __pycache__
    *.egg-info

# Couverture (si pytest-cov est installé)
# [tool:pytest]
# --cov=robot_hotel
# --cov-report=html
# --cov-report=term-missing

